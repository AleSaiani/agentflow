version: 2
updates:
  # Dev dependencies. The plugin ships zero runtime deps and a committed dist/, so:
  #  - typescript is ignored: a tsc bump can change compiled output, so update it manually + rebuild dist.
  #  - @types/node majors are ignored to stay aligned with the Node 22 runtime (engines: >=22).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Keep GitHub Actions in the CI/Release workflows current (no dist impact).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
