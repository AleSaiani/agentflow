name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - name: Test (tsc + node:test)
        run: npm test
      - name: Committed dist/ is up to date
        run: |
          npm run build
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale — run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi
